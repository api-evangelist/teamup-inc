description: 'TeamUp Inc. operates fanZ (fanzapp.io), a gamified football (soccer) fan-engagement
  mobile app for iOS and Android. fanZ combines fantasy football (fantaZ), social following of
  teams, leagues and players, prediction challenges and mini-games, a rewards system of points,
  badges and digital collectibles, an official merchandise store, and global leaderboards, plus
  news, match highlights and video content. The product is a consumer-facing mobile application
  operated by Wathbah for Information Technology and backed by 500 Global; no public developer
  API, documentation, or developer portal was found during enrichment.'
